<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GD Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1E2B;
    --ink-2:#16293A;
    --ink-3:#1D3448;
    --paper:#ECE6D6;
    --paper-dim:#93A6B3;
    --brass:#C9A227;
    --brass-dim:#8A742A;
    --stamp:#B8503F;
    --stamp-dim:#7A4038;
    --green:#5C9382;
    --hairline:rgba(201,162,39,0.22);
    --radius:3px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, rgba(201,162,39,0.06), transparent 55%),
      var(--ink);
    color:var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px;}

  /* Header */
  header{
    display:flex;align-items:flex-end;justify-content:space-between;
    border-bottom:1px solid var(--hairline);
    padding-bottom:18px;margin-bottom:22px;flex-wrap:wrap;gap:14px;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .stamp-mark{width:52px;height:52px;flex-shrink:0;}
  h1{
    font-family:'Source Serif 4', serif;
    font-weight:700;font-size:28px;letter-spacing:0.3px;margin:0;color:var(--paper);
  }
  .sub{font-size:12.5px;color:var(--paper-dim);margin-top:3px;letter-spacing:0.4px;}
  .tabs{display:flex;gap:2px;background:var(--ink-2);padding:3px;border-radius:var(--radius);border:1px solid var(--hairline);}
  .tab-btn{
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.6px;text-transform:uppercase;
    background:transparent;border:none;color:var(--paper-dim);padding:9px 16px;border-radius:2px;cursor:pointer;
    transition:all .15s ease;
  }
  .tab-btn.active{background:var(--brass);color:var(--ink);font-weight:600;}
  .tab-btn:not(.active):hover{color:var(--paper);}

  .panel{display:none;}
  .panel.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* Card */
  .card{
    background:var(--ink-2);border:1px solid var(--hairline);border-radius:var(--radius);
    padding:22px;margin-bottom:18px;
  }
  .card h2{
    font-family:'Source Serif 4',serif;font-size:16px;margin:0 0 14px;color:var(--paper);
    display:flex;align-items:center;gap:8px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--brass);letter-spacing:1.2px;
    text-transform:uppercase;margin-bottom:6px;display:block;
  }

  /* Dropzone */
  .dropzone{
    border:1.5px dashed var(--hairline);border-radius:var(--radius);
    padding:36px 20px;text-align:center;cursor:pointer;transition:.15s ease;background:rgba(201,162,39,0.03);
  }
  .dropzone:hover, .dropzone.drag{border-color:var(--brass);background:rgba(201,162,39,0.07);}
  .dropzone .icon{font-size:26px;margin-bottom:8px;opacity:.85;}
  .dropzone .main-txt{font-size:14px;color:var(--paper);}
  .dropzone .sub-txt{font-size:12px;color:var(--paper-dim);margin-top:4px;}
  input[type=file]{display:none;}

  .file-chip{
    display:inline-flex;align-items:center;gap:10px;background:var(--ink-3);border:1px solid var(--hairline);
    border-radius:var(--radius);padding:8px 14px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;margin-top:12px;
  }
  .file-chip button{background:none;border:none;color:var(--stamp);cursor:pointer;font-size:13px;}

  button.primary{
    font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:13px;
    background:var(--brass);color:var(--ink);border:none;padding:11px 20px;border-radius:var(--radius);
    cursor:pointer;letter-spacing:.2px;transition:.15s;
  }
  button.primary:hover{background:#DDB53A;}
  button.primary:disabled{background:#5a5540;color:#9a9578;cursor:not-allowed;}
  button.ghost{
    background:transparent;border:1px solid var(--hairline);color:var(--paper-dim);
    padding:10px 16px;border-radius:var(--radius);cursor:pointer;font-size:12.5px;font-family:'IBM Plex Mono',monospace;
  }
  button.ghost:hover{color:var(--paper);border-color:var(--brass-dim);}

  .actions-row{display:flex;gap:10px;margin-top:16px;align-items:center;}
  .status-line{font-size:12.5px;color:var(--paper-dim);font-family:'IBM Plex Mono',monospace;}
  .status-line.err{color:var(--stamp);}
  .status-line.ok{color:var(--green);}

  /* extracted preview */
  .rec-head{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:16px;}
  .field{min-width:170px;}
  .field label{display:block;font-size:10.5px;color:var(--paper-dim);letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px;font-family:'IBM Plex Mono',monospace;}
  .field input{
    background:var(--ink);border:1px solid var(--hairline);color:var(--paper);border-radius:2px;
    padding:8px 10px;font-family:'IBM Plex Mono',monospace;font-size:13px;width:100%;
  }
  .field input:focus{outline:none;border-color:var(--brass);}

  .item-block{
    border-top:1px dashed var(--hairline);padding-top:14px;margin-top:14px;
  }
  .item-block .tag{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--brass);letter-spacing:1px;
    text-transform:uppercase;margin-bottom:10px;display:inline-block;
  }
  .item-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .item-grid .field.span2{grid-column:1/-1;}

  .match-box{
    margin-top:12px;background:rgba(184,80,63,0.09);border:1px solid rgba(184,80,63,0.35);
    border-radius:2px;padding:10px 12px;font-size:12.5px;
  }
  .match-box .mh{color:var(--stamp);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px;}
  .match-row{display:flex;justify-content:space-between;color:var(--paper-dim);padding:3px 0;border-top:1px solid rgba(255,255,255,0.05);}
  .match-row span:last-child{color:var(--paper);font-family:'IBM Plex Mono',monospace;}

  /* Search */
  .search-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .search-bar input[type=text]{
    flex:1;min-width:220px;background:var(--ink);border:1px solid var(--hairline);color:var(--paper);
    padding:11px 14px;border-radius:var(--radius);font-size:13.5px;font-family:'IBM Plex Sans',sans-serif;
  }
  .search-bar input:focus{outline:none;border-color:var(--brass);}
  .filter-chips{display:flex;gap:6px;flex-wrap:wrap;}
  .filter-chips button{
    background:var(--ink-3);border:1px solid var(--hairline);color:var(--paper-dim);
    padding:9px 13px;border-radius:20px;font-size:11.5px;font-family:'IBM Plex Mono',monospace;cursor:pointer;
  }
  .filter-chips button.active{background:var(--brass);color:var(--ink);border-color:var(--brass);font-weight:600;}

  .result-count{font-size:11.5px;color:var(--paper-dim);font-family:'IBM Plex Mono',monospace;margin:2px 0 14px;}

  .gd-card{
    border:1px solid var(--hairline);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;
  }
  .gd-card-head{
    background:var(--ink-3);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;
    cursor:pointer;gap:10px;flex-wrap:wrap;
  }
  .gd-card-head .left{display:flex;flex-direction:column;gap:2px;}
  .gd-no{font-family:'IBM Plex Mono',monospace;color:var(--brass);font-size:13.5px;font-weight:600;}
  .gd-meta{font-size:11.5px;color:var(--paper-dim);}
  .chevron{color:var(--paper-dim);font-size:12px;transition:.15s;}
  .gd-card.open .chevron{transform:rotate(90deg);}
  .gd-card-body{display:none;padding:14px 16px 16px;background:rgba(0,0,0,0.12);}
  .gd-card.open .gd-card-body{display:block;}

  table.items-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.items-table th{
    text-align:left;color:var(--brass);font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    letter-spacing:.6px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--hairline);
  }
  table.items-table td{padding:8px 8px;border-bottom:1px solid rgba(255,255,255,0.05);vertical-align:top;color:var(--paper);}
  table.items-table td.num{font-family:'IBM Plex Mono',monospace;color:var(--paper);}

  .empty-state{text-align:center;padding:50px 20px;color:var(--paper-dim);}
  .empty-state .icon{font-size:30px;margin-bottom:10px;opacity:.6;}
  .empty-state .t1{font-size:14px;color:var(--paper);margin-bottom:4px;}
  .empty-state .t2{font-size:12px;}

  .loader{
    display:inline-block;width:13px;height:13px;border:2px solid rgba(236,230,214,0.25);
    border-top-color:var(--brass);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .footer-note{font-size:11px;color:var(--paper-dim);text-align:center;margin-top:26px;letter-spacing:.3px;}
  .footer-note button{background:none;border:none;color:var(--stamp-dim);text-decoration:underline;cursor:pointer;font-size:11px;font-family:inherit;}

  @media (max-width:640px){
    .item-grid{grid-template-columns:1fr;}
    header{align-items:flex-start;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <svg class="stamp-mark" viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="46" stroke="#C9A227" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>
        <circle cx="50" cy="50" r="36" stroke="#C9A227" stroke-width="1.5" opacity="0.5"/>
        <text x="50" y="46" text-anchor="middle" fill="#C9A227" font-family="IBM Plex Mono, monospace" font-size="9" letter-spacing="1">CUSTOMS</text>
        <text x="50" y="58" text-anchor="middle" fill="#C9A227" font-family="IBM Plex Mono, monospace" font-size="9" letter-spacing="1">LEDGER</text>
      </svg>
      <div>
        <h1>GD Ledger</h1>
        <div class="sub">Goods Declaration register &amp; item history</div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="upload">Upload GD</button>
      <button class="tab-btn" data-tab="search">Search Records</button>
    </div>
  </header>

  <!-- UPLOAD PANEL -->
  <div class="panel active" id="panel-upload">
    <div class="card">
      <span class="eyebrow">Step 1</span>
      <h2>Load a GD PDF</h2>
      <div class="dropzone" id="dropzone">
        <div class="icon">&#128196;</div>
        <div class="main-txt">Click to choose a GD PDF, or drop it here</div>
        <div class="sub-txt">GD No, Importer, HS Code, Description, Unit &amp; Assess Value are pulled automatically</div>
        <input type="file" id="fileInput" accept="application/pdf">
      </div>
      <div id="fileChipHolder"></div>
      <div class="actions-row">
        <button class="primary" id="extractBtn" disabled>Extract data</button>
        <span class="status-line" id="extractStatus"></span>
      </div>
    </div>

    <div class="card" id="previewCard" style="display:none;">
      <span class="eyebrow">Step 2</span>
      <h2>Review before saving</h2>
      <div id="previewHolder"></div>
      <div class="actions-row">
        <button class="primary" id="saveBtn">Save to cloud</button>
        <button class="ghost" id="discardBtn">Discard</button>
        <span class="status-line" id="saveStatus"></span>
      </div>
    </div>
  </div>

  <!-- SEARCH PANEL -->
  <div class="panel" id="panel-search">
    <div class="card">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search GD No, item description, HS code or importer...">
      </div>
      <div class="filter-chips" id="filterChips">
        <button class="active" data-f="all">All fields</button>
        <button data-f="gd_no">GD No</button>
        <button data-f="description">Item description</button>
        <button data-f="hs_code">HS Code</button>
        <button data-f="importer_name">Importer</button>
      </div>
      <div class="result-count" id="resultCount"></div>
      <div id="resultsHolder"></div>
    </div>
  </div>

  <div class="footer-note">
    Records are safely stored in Firebase Cloud. &nbsp;•&nbsp; <button id="resetBtn">Clear all records</button> &nbsp;•&nbsp; <button id="resetApiBtn">Reset AI API Key</button>
  </div>

</div>

<!-- Firebase CDNs (v8 Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
(function(){
  // --- YOUR FIREBASE CONFIGURATION ---
  const firebaseConfig = {
    apiKey: "AIzaSyDqdAXMEf6JodshF8Sdo_l6i7fpYfwgfc8",
    authDomain: "custom-gds-data.firebaseapp.com",
    projectId: "custom-gds-data",
    storageBucket: "custom-gds-data.firebasestorage.app",
    messagingSenderId: "939758804248",
    appId: "1:939758804248:web:c8139eb74bedad5b36d26d"
  };

  // Initialize Firebase & Firestore
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const state = { file:null, base64:null, extracted:null, allRecords:[], loaded:false };

  // ---------- Tabs ----------
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
      if(btn.dataset.tab==='search') runSearch();
    });
  });

  // ---------- File handling ----------
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const fileChipHolder = document.getElementById('fileChipHolder');
  const extractBtn = document.getElementById('extractBtn');
  const extractStatus = document.getElementById('extractStatus');

  dropzone.addEventListener('click', ()=>fileInput.click());
  dropzone.addEventListener('dragover', e=>{e.preventDefault();dropzone.classList.add('drag');});
  dropzone.addEventListener('dragleave', ()=>dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', e=>{
    e.preventDefault();dropzone.classList.remove('drag');
    if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', e=>{
    if(e.target.files[0]) handleFile(e.target.files[0]);
  });

  function handleFile(file){
    if(file.type !== 'application/pdf'){
      extractStatus.textContent = 'Please choose a PDF file.';
      extractStatus.className='status-line err';
      return;
    }
    state.file = file;
    fileChipHolder.innerHTML = '';
    const chip = document.createElement('div');
    chip.className='file-chip';
    chip.innerHTML = '<span>&#128206; '+file.name+'</span>';
    const rm = document.createElement('button');
    rm.textContent='remove';
    rm.onclick = ()=>{state.file=null;state.base64=null;fileChipHolder.innerHTML='';extractBtn.disabled=true;};
    chip.appendChild(rm);
    fileChipHolder.appendChild(chip);
    extractBtn.disabled = false;
    extractStatus.textContent='';

    const reader = new FileReader();
    reader.onload = ()=>{ state.base64 = reader.result.split(',')[1]; };
    reader.readAsDataURL(file);
  }

  function repairTruncatedJson(str){
    const itemsKeyIdx = str.indexOf('"items"');
    if(itemsKeyIdx === -1) return null;
    const arrStart = str.indexOf('[', itemsKeyIdx);
    if(arrStart === -1) return null;

    let depth = 0, inString = false, escape = false, lastGoodEnd = -1;
    for(let i = arrStart; i < str.length; i++){
      const ch = str[i];
      if(inString){
        if(escape){ escape = false; }
        else if(ch === '\\'){ escape = true; }
        else if(ch === '"'){ inString = false; }
        continue;
      }
      if(ch === '"'){ inString = true; continue; }
      if(ch === '{'){ depth++; }
      else if(ch === '}'){
        depth--;
        if(depth === 0) lastGoodEnd = i;
      }
    }
    if(lastGoodEnd === -1) return null;
    const candidate = str.slice(0, lastGoodEnd + 1) + ']}';
    try{ return JSON.parse(candidate); }catch(e){ return null; }
  }

  extractBtn.addEventListener('click', extractData);

  async function extractData(){
    if(!state.base64){ extractStatus.textContent='Still reading file, try again in a second.'; extractStatus.className='status-line err'; return; }
    
    // --- API Key Popup System (For Gemini AI) ---
    let apiKey = localStorage.getItem('gemini_key');
    if(!apiKey){
      apiKey = prompt("Bhai, yahan apni FREE Google Gemini ki API Key daalein taa ke data extract ho sakay:\n\n(Ye sirf aapke isi browser mein secure save hogi):");
      if(!apiKey) {
        extractStatus.textContent = 'API Key zaroori hai extraction ke liye.';
        extractStatus.className = 'status-line err';
        return;
      }
      localStorage.setItem('gemini_key', apiKey);
    }
    
    extractBtn.disabled = true;
    extractStatus.innerHTML = '<span class="loader"></span>Reading GD and pulling fields...';
    extractStatus.className='status-line';

    const promptText = `You are extracting structured data from a Pakistan Customs Goods Declaration (GD) PDF for an internal company records system. Extract ONLY these fields and return STRICT JSON with no markdown fences, no preamble, no explanation - just the raw JSON object, matching exactly this shape:
{
  "gd_no": "the official GD number. It sits directly under field 58 'MACHINE NO.' on the form, and is formatted like KAPW-HC-XXXXX-DD-MM-YYYY (custom office code, then HC, then a 5-digit number, then the date). Do NOT use the value near field 65 'C/F/D NO & DATE', and do NOT use any code that starts with 'C-KAPW' or similar 'C-' prefixed reference numbers elsewhere on the form - those are different references, not the GD No.",
  "gd_date": "date of the GD",
  "importer_name": "importer/consignee name, field 10",
  "items": [
    {
      "item_no": "value from field 37 ITEM NO",
      "hs_code": "value from field 41 HS Code",
      "description": "value from field 42 ITEM DESCRIPTION OF GOODS",
      "unit_value_declared": "the DECLARED unit value from field 43 UNIT VALUE (the first of the two Declared/Assessed numbers under that column)",
      "unit_value_assessed": "the ASSESSED unit value from field 43 UNIT VALUE (the second of the two Declared/Assessed numbers under that column)"
    }
  ]
}
Do not include total value or custom/assessed value in PKR - those are not needed. If the GD has multiple items, include every item in the items array, even if some fields for later items are blank. If a field cannot be found, use an empty string for it. Return ONLY the JSON object, nothing else.`;

    try{
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: promptText },
              { inlineData: { mimeType: "application/pdf", data: state.base64 } }
            ]
          }]
        })
      });
      
      const data = await response.json();
      
      if(data.error){
        if(data.error.code === 400 || data.error.code === 403) {
            localStorage.removeItem('gemini_key');
            throw new Error("Aapki API Key galat thi ya expire ho gayi hai. Nayi key daalein.");
        }
        throw new Error(data.error.message);
      }

      const textBlock = data.candidates && data.candidates[0].content.parts[0].text;
      if(!textBlock) throw new Error('No response text from extraction.');
      
      let clean = textBlock.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
      clean = clean.replace(/[\r\n\t]+/g, ' ').replace(/\s{2,}/g, ' ').trim();
      let parsed;
      
      try{
        parsed = JSON.parse(clean);
      }catch(parseErr){
        const repaired = repairTruncatedJson(clean);
        if(!repaired) throw parseErr;
        parsed = repaired;
      }
      parsed.items = Array.isArray(parsed.items) ? parsed.items : [];
      state.extracted = parsed;
      extractStatus.textContent = 'Extraction complete.';
      extractStatus.className='status-line ok';
      await renderPreview(parsed);
    }catch(err){
      console.error(err);
      extractStatus.textContent = 'Could not extract data. ' + (err.message||'');
      extractStatus.className='status-line err';
    }finally{
      extractBtn.disabled = false;
    }
  }

  // ---------- Preview + duplicate/reference lookup ----------
  const previewCard = document.getElementById('previewCard');
  const previewHolder = document.getElementById('previewHolder');
  const saveBtn = document.getElementById('saveBtn');
  const discardBtn = document.getElementById('discardBtn');
  const saveStatus = document.getElementById('saveStatus');

  async function renderPreview(rec){
    await loadAllRecords(true);
    previewCard.style.display = 'block';
    previewHolder.innerHTML = '';

    const head = document.createElement('div');
    head.className='rec-head';
    head.innerHTML = fieldHtml('gd_no','GD No', rec.gd_no) +
                      fieldHtml('gd_date','Date', rec.gd_date) +
                      fieldHtml('importer_name','Importer', rec.importer_name);
    previewHolder.appendChild(head);

    rec.items.forEach((it, idx)=>{
      const block = document.createElement('div');
      block.className='item-block';
      block.innerHTML = `<span class="tag">Item ${it.item_no || (idx+1)}</span>
        <div class="item-grid">
          ${fieldHtml('hs_code','HS Code', it.hs_code, idx)}
          ${fieldHtml('unit_value_declared','Unit Value (Declared)', it.unit_value_declared, idx)}
          ${fieldHtml('unit_value_assessed','Unit Value (Assessed)', it.unit_value_assessed, idx)}
          <div class="field span2"><label>Item Description</label><input data-item="${idx}" data-key="description" value="${escapeAttr(it.description)}"></div>
        </div>`;
      previewHolder.appendChild(block);

      const matches = findPastMatches(it.hs_code, it.description, rec.gd_no);
      if(matches.length){
        const mb = document.createElement('div');
        mb.className='match-box';
        mb.innerHTML = `<div class="mh">&#9888; This item has appeared before (${matches.length} past GD${matches.length>1?'s':''})</div>` +
          matches.slice(0,3).map(m=>`<div class="match-row"><span>${m.gdNo} &middot; ${m.date||''}</span><span>Unit (Decl) ${m.unitDeclared||'-'} &middot; Unit (Assd) ${m.unitAssessed||'-'}</span></div>`).join('');
        block.appendChild(mb);
      }
    });
  }

  function fieldHtml(key,label,val,idx){
    const attr = idx===undefined ? `data-key="${key}"` : `data-item="${idx}" data-key="${key}"`;
    return `<div class="field"><label>${label}</label><input ${attr} value="${escapeAttr(val)}"></div>`;
  }
  function escapeAttr(v){ return (v||'').toString().replace(/"/g,'&quot;'); }

  function findPastMatches(hsCode, description, currentGdNo){
    if(!hsCode && !description) return [];
    const out = [];
    state.allRecords.forEach(r=>{
      if(r.gd_no === currentGdNo) return;
      (r.items||[]).forEach(it=>{
        const hsMatch = hsCode && it.hs_code && it.hs_code.trim().toLowerCase() === hsCode.trim().toLowerCase();
        const descMatch = description && it.description && it.description.trim().toLowerCase() === description.trim().toLowerCase();
        if(hsMatch || descMatch){
          out.push({ gdNo:r.gd_no, date:r.gd_date, unitDeclared:it.unit_value_declared, unitAssessed:it.unit_value_assessed });
        }
      });
    });
    return out;
  }

  discardBtn.addEventListener('click', ()=>{
    state.extracted=null; state.file=null; state.base64=null;
    previewCard.style.display='none'; fileChipHolder.innerHTML=''; extractBtn.disabled=true;
    document.getElementById('extractStatus').textContent='';
  });

  saveBtn.addEventListener('click', saveRecord);

  async function saveRecord(){
    const rec = { gd_no:'', gd_date:'', importer_name:'', items:[] };
    previewHolder.querySelectorAll('[data-key]').forEach(inp=>{
      if(inp.dataset.item === undefined){
        rec[inp.dataset.key] = inp.value.trim();
      }
    });
    const itemCount = state.extracted.items.length;
    for(let i=0;i<itemCount;i++){
      rec.items.push({ item_no: state.extracted.items[i].item_no || String(i+1), hs_code:'', description:'', unit_value_declared:'', unit_value_assessed:'' });
    }
    previewHolder.querySelectorAll('[data-item]').forEach(inp=>{
      const i = parseInt(inp.dataset.item,10);
      rec.items[i][inp.dataset.key] = inp.value.trim();
    });

    if(!rec.gd_no){
      saveStatus.textContent = 'GD No is required before saving.';
      saveStatus.className='status-line err';
      return;
    }
    rec.saved_at = new Date().toISOString();

    saveBtn.disabled = true;
    
    try{
      saveStatus.innerHTML = '<span class="loader"></span>Saving data to cloud...';
      await db.collection('gd_ledger').doc(rec.gd_no).set(rec);

      saveStatus.textContent = 'Data saved successfully!';
      saveStatus.className='status-line ok';
      
      const existingIdx = state.allRecords.findIndex(r => r.gd_no === rec.gd_no);
      if (existingIdx >= 0) {
        state.allRecords[existingIdx] = rec;
      } else {
        state.allRecords.push(rec);
      }

      setTimeout(()=>{
        previewCard.style.display='none';
        state.extracted=null; state.file=null; state.base64=null;
        fileChipHolder.innerHTML=''; extractBtn.disabled=true;
        document.getElementById('extractStatus').textContent='';
        saveStatus.textContent='';
      }, 1500);
    }catch(err){
      console.error("Save Error: ", err);
      saveStatus.textContent = 'Save failed. Please check connection.';
      saveStatus.className='status-line err';
    }finally{
      saveBtn.disabled = false;
    }
  }

  // ---------- Load all records from Firestore ----------
  async function loadAllRecords(force){
    if(state.loaded && !force) return;
    try {
      const snapshot = await db.collection('gd_ledger').get();
      const records = [];
      snapshot.forEach(doc => {
        records.push(doc.data());
      });
      state.allRecords = records;
      state.loaded = true;
    } catch(e) {
      console.error("Error loading records:", e);
      state.allRecords = [];
      state.loaded = true;
    }
  }

  // ---------- Search ----------
  const searchInput = document.getElementById('searchInput');
  const filterChips = document.getElementById('filterChips');
  const resultsHolder = document.getElementById('resultsHolder');
  const resultCount = document.getElementById('resultCount');
  let activeFilter = 'all';

  filterChips.addEventListener('click', e=>{
    if(e.target.tagName!=='BUTTON') return;
    filterChips.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    activeFilter = e.target.dataset.f;
    runSearch();
  });
  searchInput.addEventListener('input', debounce(runSearch, 200));

  function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

  async function runSearch(){
    await loadAllRecords(false);
    const q = searchInput.value.trim().toLowerCase();
    resultsHolder.innerHTML = '';

    let matches = state.allRecords;
    if(q){
      matches = state.allRecords.filter(r=>{
        if(activeFilter==='gd_no') return (r.gd_no||'').toLowerCase().includes(q);
        if(activeFilter==='importer_name') return (r.importer_name||'').toLowerCase().includes(q);
        if(activeFilter==='description') return (r.items||[]).some(it=>(it.description||'').toLowerCase().includes(q));
        if(activeFilter==='hs_code') return (r.items||[]).some(it=>(it.hs_code||'').toLowerCase().includes(q));
        const hay = [r.gd_no, r.importer_name, r.exporter_name].concat((r.items||[]).flatMap(it=>[it.description,it.hs_code])).join(' ').toLowerCase();
        return hay.includes(q);
      });
    }

    matches = matches.slice().sort((a,b)=> (b.saved_at||'').localeCompare(a.saved_at||''));

    resultCount.textContent = state.allRecords.length===0
      ? ''
      : `${matches.length} of ${state.allRecords.length} record${state.allRecords.length===1?'':'s'}`;

    if(state.allRecords.length===0){
      resultsHolder.innerHTML = `<div class="empty-state"><div class="icon">&#128196;</div><div class="t1">No records in the ledger yet</div><div class="t2">Upload a GD from the first tab to start building your history.</div></div>`;
      return;
    }
    if(matches.length===0){
      resultsHolder.innerHTML = `<div class="empty-state"><div class="icon">&#128269;</div><div class="t1">No match found</div><div class="t2">This item hasn't been recorded before.</div></div>`;
      return;
    }

    matches.forEach(r=>{
      const card = document.createElement('div');
      card.className='gd-card';
      const itemCount = (r.items||[]).length;

      card.innerHTML = `
        <div class="gd-card-head">
          <div class="left">
            <span class="gd-no">${r.gd_no||'—'}</span>
            <span class="gd-meta">${r.importer_name||'—'} &middot; ${r.gd_date||'—'} &middot; ${itemCount} item${itemCount===1?'':'s'}</span>
          </div>
          <span class="chevron">&#9656;</span>
        </div>
        <div class="gd-card-body">
          <table class="items-table">
            <thead><tr><th>Item</th><th>HS Code</th><th>Description</th><th>Unit Value (Declared)</th><th>Unit Value (Assessed)</th></tr></thead>
            <tbody>
              ${(r.items||[]).map(it=>`<tr>
                <td class="num">${it.item_no||''}</td>
                <td class="num">${it.hs_code||''}</td>
                <td>${it.description||''}</td>
                <td class="num">${it.unit_value_declared||''}</td>
                <td class="num">${it.unit_value_assessed||''}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
      card.querySelector('.gd-card-head').addEventListener('click', ()=>card.classList.toggle('open'));
      resultsHolder.appendChild(card);
    });
  }

  // ---------- Reset (Delete all from Cloud) ----------
  document.getElementById('resetBtn').addEventListener('click', async ()=>{
    if(!confirm('Delete every record in the cloud ledger? This cannot be undone.')) return;
    
    try {
      const snapshot = await db.collection('gd_ledger').get();
      const batch = db.batch();
      
      snapshot.forEach(doc => {
        batch.delete(doc.ref);
      });
      await batch.commit();
      
      state.allRecords = []; 
      state.loaded = true;
      runSearch();
      alert('All records deleted from the cloud.');
    } catch(e) {
      console.error("Error deleting records:", e);
      alert('Delete failed. Please check permissions.');
    }
  });

  // ---------- Reset API Key Manually ----------
  document.getElementById('resetApiBtn').addEventListener('click', ()=>{
      localStorage.removeItem('gemini_key');
      localStorage.removeItem('anthropic_key');
      alert("Aapki API Key browser se delete ho gayi hai. Nayi key daalein.");
  });

  // initial load for search tab
  loadAllRecords(false);
})();
</script>
</body>
</html>
